services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: arak-bar:latest
    container_name: arak-bar
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${DOMAIN:-arak-bar.ir}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
      LOG_CHANNEL: stderr
      RUN_MIGRATIONS: "true"
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.arak-bar.rule=Host(`${DOMAIN:-arak-bar.ir}`) || Host(`www.${DOMAIN:-arak-bar.ir}`)
      - traefik.http.routers.arak-bar.entrypoints=websecure
      - traefik.http.routers.arak-bar.tls=true
      - traefik.http.routers.arak-bar.tls.certresolver=myresolver
      - traefik.http.services.arak-bar.loadbalancer.server.port=80
      - traefik.http.middlewares.arak-bar-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.arak-bar-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.arak-bar-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.arak-bar-security.headers.frameDeny=true
      - traefik.http.routers.arak-bar.middlewares=arak-bar-security

volumes:
  app-storage:

networks:
  proxy:
    external: true
